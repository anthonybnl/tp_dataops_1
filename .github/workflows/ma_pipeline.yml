name: ma_pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Le GITHUB_TOKEN reçoit ces droits : aucun secret à créer pour GHCR
permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: Set up Python 12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: install requirements
        run: python -m pip install -r requirements-dev.txt
      - name: installation de la_gazette_des_sorciers
        run: pip install --no-deps .
      - name: lint
        run: flake8 -v

  build_docker:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      # GHCR exige un nom en minuscules ; github.repository peut contenir des majuscules
      - name: Nom d'image en minuscules
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Builder docker-container : nécessaire pour exporter le cache (mode=max, registry, gha…)
      - uses: docker/setup-buildx-action@v4

      - name: Login GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags & labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build Docker image
        uses: docker/bake-action@v7
        with:
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file-tags }}
            cwd://${{ steps.meta.outputs.bake-file-labels }}
          push: ${{ github.event_name != 'pull_request' }}
        env:
          IMAGE: ${{ env.IMAGE }}
